[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modular-rag-mcp-server"
version = "0.1.0"
description = "Interface-first modular RAG MCP server skeleton"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "chromadb>=0.5,<2.0",
    "langchain-text-splitters>=0.3,<2.0",
    "markitdown[pdf]>=0.1,<1.0",
    "mcp>=2.0,<3.0",
    "Pillow>=10.0,<13.0",
    "pymupdf>=1.24,<2.0",
    "PyYAML>=6.0",
    "streamlit>=1.36,<2.0",
]

[project.scripts]
modular-rag-mcp = "src.mcp_server.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "unit: fast contract and unit tests",
    "integration: integration tests",
    "e2e: end-to-end tests",
]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_unused_configs = true
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["chromadb", "langchain_text_splitters", "markitdown", "pymupdf", "pytest"]
follow_imports = "skip"

[tool.hatch.build.targets.wheel]
packages = [
    "src/application",
    "src/core",
    "src/ingestion",
    "src/libs",
    "src/mcp_server",
    "src/observability",
    "src/ports",
]
