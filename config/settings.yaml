# Knowledge service runs in-process by default; HTTP mode can supply an endpoint later.
knowledge_service:
  mode: local
  endpoint: null
  timeout_seconds: 30

# MiniMax exposes an OpenAI-compatible API. Values come from ~/.zshrc at runtime.
llm:
  provider: openai
  model: ${SGPT_MODEL}
  base_url: ${OPENAI_BASE_URL}
  api_key: ${MINIMAX_API_KEY}

# Embeddings remain independent because MiniMax is configured only for generation here.
embedding:
  provider: openai
  model: text-embedding-3-small

# Markdown-aware chunking for ingestion.
splitter:
  provider: recursive
  chunk_size: 1000
  chunk_overlap: 200

# 规则去噪始终执行；启用后再通过当前 OpenAI-compatible 模型精炼文本。
ingestion:
  # 同一文件任务的领取租约；worker 崩溃后可由后续任务接管。
  claim_lease_seconds: 900
  # Embedding 按批发送，避免大文档一次请求过多文本。
  batch_size: 32
  # 摄取控制面、稀疏索引和图片引用都由 CLI 从这里装配，运行时不硬编码路径。
  storage:
    integrity_db_path: ./data/db/ingestion_history.db
    bm25_path: ./data/db/bm25
    image_db_path: ./data/db/image_index.db
    image_root: ./data/images
    upload_root: ./data/uploads
  chunk_refiner:
    use_llm: true
  # 为每个 Chunk 生成语义 title、summary 和 tags；失败时自动使用规则结果。
  metadata_enricher:
    use_llm: true
  # MiniMax M3 通过现有 OpenAI-compatible 接口接收图片，无需独立 Vision Provider。
  image_captioner:
    enabled: true

# Persistent local vector index.
vector_store:
  backend: chroma
  persist_path: ./data/db/chroma
  collection_name: default
  distance_metric: cosine

# Dense and sparse candidates are fused with reciprocal rank fusion.
retrieval:
  sparse_backend: bm25
  fusion_algorithm: rrf
  top_k_dense: 20
  top_k_sparse: 20
  top_k_final: 10

# Disabled until a concrete reranker backend is configured.
rerank:
  backend: none
  model: cross-encoder/ms-marco-MiniLM-L-6-v2
  top_m: 30
  prompt_path: ./config/prompts/rerank.txt
  # 具体重排后端超过该时间预算后回退到 RRF 原顺序。
  timeout_seconds: 10

# Lightweight local metrics are the initial evaluation backend.
evaluation:
  backends: [custom]
  golden_test_set: ./tests/fixtures/golden_test_set.json

# Trace output is kept under the ignored runtime logs directory.
observability:
  enabled: true
  log_file: ./logs/traces.jsonl

# Local maintainer dashboard. It binds to loopback unless explicitly overridden.
dashboard:
  enabled: true
  address: 127.0.0.1
  port: 8501
  traces_dir: ./logs
  auto_refresh: true
  refresh_interval: 5
